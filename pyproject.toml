
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-orders-api"
version = "0.1.0"
description = "A learning project for Python backend development"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
